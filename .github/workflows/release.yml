name: Release

on:
  push:
    branches: [master]

# Every scope here is needed by exactly one job, so grant them per job: a
# workflow-level block hands `packages: write` and `id-token: write` to the
# semver job, which only creates a tag and a release.
permissions: {}

jobs:
  semver:
    runs-on: ubuntu-latest
    permissions:
      contents: write # go-semantic-release creates the tag and the release
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # go-semantic-release talks to the API with the token below; the
          # checkout is only read locally, for the commit history.
          persist-credentials: false

      - uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f # v1.24.1
        id: semver
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  goreleaser:
    runs-on: ubuntu-latest
    needs: semver
    if: needs.semver.outputs.version != ''
    permissions:
      contents: write # upload the release assets
      packages: write # ko pushes the image to ghcr.io
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: v${{ needs.semver.outputs.version }}
          # Nothing on this path pushes with git: assets go through GITHUB_TOKEN,
          # the image through docker/login-action, signatures through OIDC, and
          # .goreleaser.yml declares no cross-repository publisher.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # goreleaser publishes from this job; a poisoned build cache would
          # land in released artifacts.
          cache: false

      # Pinned deliberately. Leaving this to the installer's default is how
      # v1.0.5 silently moved from simple-signing to Sigstore bundles and broke
      # `cosign verify` for anyone on cosign 2.x. buildscripts/bump-actions.sh
      # keeps the pin current, so the change arrives in a reviewable sweep.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

      - uses: anchore/sbom-action/download-syft@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KO_DOCKER_REPO: ghcr.io/kypello-io/kc
