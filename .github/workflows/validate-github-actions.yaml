name: "Validate GitHub Actions"

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      # zizmor exits 1 on a structurally invalid config, and a suppression added
      # here weakens every audit silently, so a change to it has to be exercised
      # like any workflow change.
      - '.github/zizmor.yml'
      # dependabot-cooldown reads this file. Without it here, a change that
      # weakens the cooldown never re-runs the audit that would catch it.
      - '.github/dependabot.yml'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/zizmor.yml'
      - '.github/dependabot.yml'

permissions:
  contents: read

jobs:
  zizmor:
    name: "Lint"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # for uploading SARIF results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run zizmor"
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # `config`, not `config-file`: the action rejected the old name as an
          # unexpected input. zizmor discovered .github/zizmor.yml on its own
          # regardless, so this made the load explicit rather than fixing a
          # config that was being ignored. SARIF upload needs no input at all -
          # `advanced-security` defaults to true, and `sarif-upload` was
          # likewise not a real input.
          config: .github/zizmor.yml
          inputs: .github
