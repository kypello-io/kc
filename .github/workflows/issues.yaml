# @format

name: Issue Workflow

on:
  issues:
    types:
      - opened

# The job authenticates with BOT_PAT, not GITHUB_TOKEN, so the automatic token
# needs no scopes at all. An explicit empty block is what closes both the zizmor
# excessive-permissions finding and CodeQL's actions/missing-workflow-permissions.
permissions: {}

jobs:
  add-to-project:
    name: Add issue to project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/orgs/kypello-io/projects/2
          github-token: ${{ secrets.BOT_PAT }}
          labeled: bug, needs-triage
          label-operator: OR